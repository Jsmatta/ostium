name: web-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared web-client documentation
        run: |
          test -f mobile/README.md
          test -f web/README.md
          echo "The web dashboard is built from the shared Expo client in mobile/."
